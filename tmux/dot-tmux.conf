# set the activation key
unbind C-b
set -g prefix `
bind-key ` send-prefix  # escape hatch: `` sends a single `

# other key bindings
bind-key Space next-window
bind-key '|' split-window -h -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Move the current window left/right; -d makes focus follow the moved window.
bind-key -n C-S-Left  swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# Keep window numbers contiguous after closing or moving windows
set -g renumber-windows on

# Set status bar
set -g status-right "#{=22:pane_title} %m/%d %l:%M%p"
set -g status-style "fg=white,bg=black"

# highlight the currently active window
setw -g window-status-current-style "fg=black,bg=red"
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#I:#W"

# highlight windows with activity
setw -g monitor-activity on
set -g visual-activity on

set -g history-limit 1000000

# Enable mouse control
set -g mouse on

# Tell Emacs/Vim when the pane gains or loses focus
set -g focus-events on

# Standard modern terminal profile inside tmux. Controls inside of tmux pane.
# On macOS check `infocmp tmux-256color`; if it fails, older system ncurses
# lacks the entry and programs inside tmux will complain.
set -g default-terminal "tmux-256color"

# Clipboard
# tmux's defaults already handle the system clipboard: copying in copy mode
# sends OSC 52 to Ghostty (set-clipboard defaults to "external", and the
# xterm* "clipboard" terminal feature is built in). Programs inside tmux
# cannot write the clipboard; add `set -s set-clipboard on` if you want them to.
#
# Linux: mouse selections (drag, double-click word, triple-click line) go to
# PRIMARY (middle-click) instead of CLIPBOARD, matching Emacs and Ghostty.
# -C stops tmux's own OSC 52 to CLIPBOARD; the pipe sends OSC 52 with the "p"
# target to the client terminal instead. Keyboard copies still go to CLIPBOARD.
# The click bindings are tmux's defaults with only the final copy changed.
# Shift+middle-click pastes the system PRIMARY (bypasses tmux mouse capture).
# macOS has no PRIMARY (Ghostty drops "p"), so the defaults stay there.
if-shell 'test "$(uname)" = Linux' {
  set -g @copy-primary 'base64 | tr -d "\n" | { printf "\033]52;p;"; cat; printf "\007"; } > #{client_tty}'

  bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel -C '#{E:@copy-primary}'
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel -C '#{E:@copy-primary}'

  bind-key -n DoubleClick1Pane { select-pane -t=; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -H; send -X select-word; run -d0.3; send -X copy-pipe-and-cancel -C '#{E:@copy-primary}' } }
  bind-key -n TripleClick1Pane { select-pane -t=; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -H; send -X select-line; run -d0.3; send -X copy-pipe-and-cancel -C '#{E:@copy-primary}' } }
  bind-key -T copy-mode    DoubleClick1Pane { select-pane; send -X select-word; run -d0.3; send -X copy-pipe-and-cancel -C '#{E:@copy-primary}' }
  bind-key -T copy-mode    TripleClick1Pane { select-pane; send -X select-line; run -d0.3; send -X copy-pipe-and-cancel -C '#{E:@copy-primary}' }
  bind-key -T copy-mode-vi DoubleClick1Pane { select-pane; send -X select-word; run -d0.3; send -X copy-pipe-and-cancel -C '#{E:@copy-primary}' }
  bind-key -T copy-mode-vi TripleClick1Pane { select-pane; send -X select-line; run -d0.3; send -X copy-pipe-and-cancel -C '#{E:@copy-primary}' }
}
