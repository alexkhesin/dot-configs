# set the activation key
unbind C-b
set -g prefix `
bind-key ` send-prefix  # escape hatch: `` sends a single `

# other key bindings
bind-key Space next-window
bind-key '|' split-window -h -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Move the current window left/right; -d makes focus follow the moved window.
bind-key -n C-S-Left  swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# Keep window numbers contiguous after closing or moving windows
set -g renumber-windows on

# Set status bar
set -g status-right "#{=22:pane_title} %m/%d %l:%M%p"
set -g status-style "fg=white,bg=black"

# highlight the currently active window
setw -g window-status-current-style "fg=black,bg=red"
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#I:#W"

# highlight windows with activity
setw -g monitor-activity on
set -g visual-activity on

set -g history-limit 1000000

# Mouse off: Ghostty handles selection natively (Linux: select = PRIMARY,
# Ctrl+Shift+C = CLIPBOARD; macOS: Cmd+C), locally and over SSH.
# Explicit "off" so reloading a running server turns it off too.
set -g mouse off

# With the mouse off, Ghostty turns the wheel into Up/Down arrow keys on the
# alternate screen (mode 1007), which would scroll shell history. Turn that
# mode off whenever tmux takes over the screen, so the wheel does nothing.
set -as terminal-overrides ',xterm*:smcup=\E[?1049h\E[?1007l'

# Tell Emacs/Vim when the pane gains or loses focus
set -g focus-events on

# Standard modern terminal profile inside tmux. Controls inside of tmux pane.
# On macOS check `infocmp tmux-256color`; if it fails, older system ncurses
# lacks the entry and programs inside tmux will complain.
set -g default-terminal "tmux-256color"

# Clipboard
# Copies go to the system clipboard through OSC 52 (built-in xterm* clipboard
# feature). "on" also forwards OSC 52 from programs inside panes (terminal
# Emacs/Neovim, pipe-to-clipboard tools over SSH), so any of them can
# overwrite the clipboard. The default, "external", forwards only tmux's own copies.
set -s set-clipboard on