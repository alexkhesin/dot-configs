# set the activation key
unbind C-b
set -g prefix `
bind-key ` send-prefix  # escape hatch: `` sends a single `

# other key bindings
bind-key Space next-window
bind-key '|' split-window -h -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"

bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Set status bar
set -g status-right "#{=22:pane_title} %m/%d %l:%M%p"
set -g status-style "fg=white,bg=black"

# highlight the currently active window
set-window-option -g window-status-current-style "fg=black,bg=red"
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#I:#W"

# highlight windows with activity
setw -g monitor-activity on
set -g visual-activity on

set -g history-limit 1000000

# Enable mouse control
set -g mouse on

# Standard modern terminal profile inside tmux. Controls inside of tmux pane.
set -g default-terminal "tmux-256color"

# Clipboard forwarding to underlying terminal and then to the OS
# 1. Forward OSC 52 clipboard commands up to the parent terminal
set -s set-clipboard on
set -g allow-passthrough on

# 2. Tell tmux that the PARENT terminal outside (Ghostty/xterm) supports clipboard and Ms escapes:
# Outer terminal matching: matches xterm-256color, xterm-ghostty, etc.
set -as terminal-features ',xterm*:clipboard'
set -as terminal-overrides ',xterm*:Ms=\E]52;%p1%s;%p2%s\007'